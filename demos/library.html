<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Library Management | AZO.OS</title><link rel="stylesheet" href="demo.css"></head>
<body>
<a href="../#projects">← Projelere dön</a>
<header><p class="eyebrow">AZO.OS / TARAYICI DEMOSU</p><h1>Library Management</h1><p>Örnek katalogdan bir kitap seç, ödünç alma isteği gönder ve yönetici panelinden onayla. Demo verileri bu sayfada kalır.</p></header>
<main class="layout">
  <section class="panel"><h2>Katalog</h2><label for="search">Kitap veya yazar ara</label><input id="search" type="search"><ul id="books" class="books"></ul></section>
  <section class="panel"><h2>Ödünç alma işlemleri</h2><p id="message" role="status">İlk isteği katalogdan oluştur.</p><ul id="requests" class="books" aria-label="Yönetici onay kuyruğu"></ul><button id="reset" type="button">Demoyu sıfırla</button></section>
</main>
