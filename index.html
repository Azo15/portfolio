    <div class="case-overlay" data-case-overlay hidden>

        <div class="case-body" data-case-body></div>
      </section>
    </div>

    <div class="palette-overlay" data-palette-overlay hidden>

        <div class="palette-search"><span class="mono">AZO.OS / CMD</span><input type="search" data-palette-input placeholder="Navigate or search projects…" autocomplete="off"><button class="icon-button" type="button" data-close-palette aria-label="Close command palette">×</button></div>
        <div class="palette-results" data-palette-results></div>
      </section>
    </div>
    <div class="toast" data-toast role="status" aria-live="polite"></div>
